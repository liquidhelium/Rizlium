[package]
name = "rizlium_editor"
version = "0.2.2"
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
rizlium_render = { path = "../rizlium_render" }
rizlium_dyn_plugin = { path = "../rizlium_dyn_plugin"}
rune = "0.14"
anyhow = "1"
bevy_egui = "0.34"
egui = "0.31"
egui_dock = { version = "0.16", features = ["serde"] }
# egui_tracing = "0.2"
egui-notify = "0.19"
tracing-subscriber = "*"
# Todo: split x11, wayland and webgl2
bevy = { workspace = true}
rizlium_chart = { path = "../rizlium_chart" }
bevy-persistent = { version = "0.8", features = ["json", "toml"] }
serde = { version = "*", features = ["derive"] }
dirs = "6.0"
rfd = {version = "*",default-features=false, features = ["async-std","gtk3"]}
# Needed to poll Task
futures-lite = "2"
async-fs = "*"
indexmap = { version = "*", features = ["serde"] }
enum_dispatch = "*"
snafu = "0.8.2"
smallvec = { version = "1", features = ["serde"] }
strum = { version = "0.27", features = ["derive"] }
serde_json = "1.0"
serde_yaml = "0.9.33"
rust-i18n = "3"
helium_framework = { path = "../helium_framework", features = [
    "serde",
] }
bevy_prototype_lyon = { git = "https://github.com/liquidhelium/bevy_prototype_lyon_rizlium" }
zip = "4.3"
bevy_kira_audio = "0.23"
kira = "0.9"
uuid = { version = "1.4", features = ["v4"] }
[dev-dependencies]
serde_json = "*"

[package.metadata.i18n]
available-locales = ["en", "zh-CN"]

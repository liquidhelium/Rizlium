[package]
name = "rizlium_tui_render"
version = "0.1.0"
edition = "2024"

[dependencies]
ratatui = "0.28"
crossterm = "0.28"

rizlium_chart = { path = "../rizlium_chart", features = ["rizline", "serde", "runtime"] }

anyhow = "1.0"

[dev-dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1.0"
serde_yaml = "0.9.33"
zip = "8"

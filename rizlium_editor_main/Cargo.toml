[package]
name = "rizlium_editor_main"
version = "0.2.2"
edition = "2021"

[dependencies]
rizlium_core = { path = "../rizlium_core" }
rizlium_project = { path = "../rizlium_project" }
rizlium_audio = { path = "../rizlium_audio" }
rizlium_ui = { path = "../rizlium_ui" }
rizlium_extensions = { path = "../rizlium_extensions" }
rizlium_render = { path = "../rizlium_render" }
bevy = { version = "0.16", default-features = false, features = [
    "bevy_asset",
    "bevy_winit",
    "bevy_core_pipeline",
    "bevy_render",
    "bevy_sprite",
    "png",
    "hdr",
    "zstd",
    "x11",
    "ktx2",
    "tonemapping_luts",
    "webgl2",
    "wayland",
    "multi_threaded",
    "bevy_gizmos",
    "bevy_picking",
    "bevy_mesh_picking_backend"
] }
bevy_egui = "0.25"
egui = "0.31"
egui_dock = { version = "0.16", features = ["serde"] }
egui-notify = "0.19"
tracing-subscriber = "*"
bevy-inspector-egui = "0.22"
bevy-persistent = { version = "0.8", features = ["json", "toml"] }
helium_framework = { git = "https://github.com/liquidhelium/helium_framework", features = ["serde"] }
bevy_prototype_lyon = { git = "https://github.com/liquidhelium/bevy_prototype_lyon_rizlium" }
dirs = "*"
rfd = {version = "*",default-features=false, features = ["async-std","gtk3"]}
serde = { version = "*", features = ["derive"] }
rust-i18n = "3"
indexmap = { version = "*", features = ["serde"] }
enum_dispatch = "*"
snafu = "0.8.2"
smallvec = { version = "1", features = ["serde"] }
strum = { version = "0.26", features = ["derive"] }
serde_json = "*"
serde_yaml = "*"
uuid = { version = "1.4", features = ["v4"] }

[package.metadata.i18n]
available-locales = ["en", "zh-CN"]